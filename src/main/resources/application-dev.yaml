spring:
    application:
        name: sportshub-backend
    config:
        # Local secrets (GITHUB_OAUTH_CLIENT_ID/SECRET) come from the git-ignored `.env` next to
        # docker-compose.yaml -- not from the shared IntelliJ run config, which is a tracked file.
        # KEY=VALUE lines parse as properties; optional, so a missing .env just falls back to the
        # placeholders below. Real environment variables still take precedence.
        import: optional:file:.env[.properties]
    datasource:
        url: jdbc:h2:file:./data/testdb;AUTO_SERVER=TRUE
        driver-class-name: org.h2.Driver
        username: sa
        password:
    h2:
        console:
            enabled: true
    flyway:
        # Dev uses H2 + Hibernate create-drop for a fast, throwaway schema each boot.
        # Flyway's migrations are MySQL-specific (prod only), so keep it off here.
        enabled: false
    jpa:
        hibernate:
            ddl-auto: create-drop
        defer-datasource-initialization: true
    sql:
        init:
            mode: always
            # Seed the access domain (federations, clubs, bootstrap admin) after schema creation.
            data-locations: classpath:seed/access-seed.sql
    servlet:
        multipart:
            max-file-size: 150MB
            max-request-size: 180MB
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8080/realms/dtfb
            client:
                registration:
                    github:
                        # Set both in `.env` (see spring.config.import above) for a working local
                        # GitHub login; the placeholders make the login 401 at GitHub. Callback to
                        # register on the dev OAuth App: http://localhost:8082/login/oauth2/code/github
                        client-id: ${GITHUB_OAUTH_CLIENT_ID:dev-placeholder-client-id}
                        client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:dev-placeholder-client-secret}
                        # "repo" (not just read:* / public_repo) so the logged-in user's own token can
                        # file the converted issue (GitHubIssueClient — see convertIssue()) in either
                        # conversion target: sportshub-backend (public) or dtfb-frontend-ng (private).
                        scope: read:user,read:org,repo
springdoc:
    swagger-ui:
        # Keycloak login from the "Authorize" dialog (public SPA client, PKCE).
        oauth:
            client-id: dtfb-admin-web
            use-pkce-with-authorization-code-grant: true
server:
    port: 8082
sportshub:
    security:
        # See application-prod.yaml's comment -- same clients locally.
        allowed-clients: dtfb-admin-web,dtfb-api
    cors:
        # Origin of the local admin console (the Angular dev server).
        allowed-origins: http://localhost:4200
    importer:
        # Pseudonymized exports (docs/28): allowed | required | forbidden. Dev takes both.
        anonymized: allowed
tracker:
    # GitHub org whose members may convert/delete tracker issues (see GitHubOrgOAuth2UserService).
    github-org: ${TRACKER_GITHUB_ORG:Deutscher-Tischfussballbund}
logging:
    level:
        org.springframework.web: DEBUG
        org.springframework.web.multipart: DEBUG
        org.springframework.security: DEBUG
