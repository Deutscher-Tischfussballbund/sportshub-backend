spring:
    application:
        name: sportshub-backend
    datasource:
        # MySQL in its own container (see docker-compose.yaml). All values env-driven
        # so the same image runs in any environment.
        url: ${SPRING_DATASOURCE_URL:jdbc:mysql://sportshub-db:3306/sportshub}
        username: ${SPRING_DATASOURCE_USERNAME:sportshub}
        password: ${SPRING_DATASOURCE_PASSWORD}
    flyway:
        # Flyway owns the schema in prod. Runs db/migration/*.sql before Hibernate,
        # then `validate` (below) asserts the entities match the migrated schema.
        enabled: true
    jpa:
        hibernate:
            # Flyway creates/evolves the schema; Hibernate only validates it matches
            # the entities. Never let Hibernate mutate a Flyway-managed prod schema.
            ddl-auto: validate
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
    servlet:
        multipart:
            max-file-size: 150MB
            max-request-size: 180MB
    security:
        oauth2:
            resourceserver:
                jwt:
                    # PUBLIC issuer — must equal the `iss` claim Keycloak stamps
                    # (its KC_HOSTNAME). Used as a string for claim validation; no
                    # network call, so it does not couple startup to Keycloak.
                    issuer-uri: ${KEYCLOAK_ISSUER_URI:https://id.dtfb.de/realms/dtfb}
                    # INTERNAL JWKS endpoint, reached over the shared docker network.
                    # Setting jwk-set-uri makes the decoder fetch keys lazily (on the
                    # first token), so the backend boots even if Keycloak is not up yet.
                    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/dtfb/protocol/openid-connect/certs}
            client:
                registration:
                    github:
                        # GitHub OAuth App client-id/secret gating convert/delete on the tracker to
                        # members of tracker.github-org below. No defaults — unset means the tracker's
                        # login is broken, not silently open or silently using a shared placeholder.
                        client-id: ${GITHUB_OAUTH_CLIENT_ID}
                        client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
                        # "repo" (not just read:* / public_repo) so the logged-in user's own token can
                        # file the converted issue (GitHubIssueClient — see convertIssue()) in either
                        # conversion target: sportshub-backend (public) or dtfb-frontend-ng (private).
                        scope: read:user,read:org,repo
springdoc:
    swagger-ui:
        oauth:
            client-id: dtfb-admin-web
            use-pkce-with-authorization-code-grant: true
server:
    port: 8082
    # Behind an nginx reverse proxy: without this, Spring builds absolute URLs (notably
    # the GitHub OAuth2 client's redirect_uri) from the raw request it receives from
    # nginx, not the public scheme/host — trust X-Forwarded-* instead. Requires nginx
    # to set X-Forwarded-Proto/Host on the proxied vhost.
    forward-headers-strategy: framework
sportshub:
    bootstrap:
        # dtfb_id granted GLOBAL ADMIN on startup so a fresh prod DB has a first
        # admin (the dev seed is dev-only). Idempotent; unset = no-op. Set it for
        # the first deploy, then it can stay (or be cleared) safely.
        admin-dtfb-id: ${SPORTSHUB_BOOTSTRAP_ADMIN_DTFB_ID:}
    cors:
        # Allowed CORS origins for the admin console(s). Comma-separated for several,
        # e.g. https://admin.dtfb.de,https://admin.stage.dtfb.de
        allowed-origins: ${SPORTSHUB_CORS_ALLOWED_ORIGINS:https://admin.dtfb.de}
tracker:
    # GitHub org whose members may convert/delete tracker issues (see GitHubOrgOAuth2UserService).
    github-org: ${TRACKER_GITHUB_ORG:Deutscher-Tischfussballbund}
